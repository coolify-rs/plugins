# coolify-rs/healthchecks: the first-party Healthchecks.io plugin from the coolify-rs repository
# (plugins/official/healthchecks). Every published version is immutable; only `yanked` may change later.
# See README.md.

[[versions]]
version = "0.1.0"
source = "https://github.com/coolify-rs/coolify-rs"
commit = "1c0c4c2d15d8227c5dfc4c27c23a7d30daa401ad"
toolchain = "rust 1.99.1, target wasm32-wasip2"
builder = "docker.io/library/rust:1.99.1-slim-bookworm@sha256:f2c004e3d2d8b547e8cf7ffbc29205385f4e71d23e53e4e383065db5e9f822cd"
sha256 = "3777001ccd926a84b3f7cff427cfe2da9a90b9e949ff1c932e9ea0a6cf27aa1e"
url = "https://github.com/coolify-rs/plugins/releases/download/healthchecks-v0.1.0/healthchecks.wasm"

[versions.build]
dir = "plugins"
command = "rustup target add wasm32-wasip2 && cargo build --release --locked --target wasm32-wasip2 -p healthchecks"
artifact = "target/wasm32-wasip2/release/healthchecks.wasm"

[versions.manifest]
id = "coolify-rs/healthchecks"
name = "Healthchecks.io"
version = "0.1.0"
description = "Pings Healthchecks.io for every scheduled task and database or storage backup, so a job that silently stops running raises an alarm."
license = "Apache-2.0"
source = "https://github.com/coolify-rs/coolify-rs/tree/main/plugins/official/healthchecks"
api = "0.1"

[versions.manifest.capabilities]
events = [
    "scheduled_task.succeeded",
    "scheduled_task.failed",
    "backup.succeeded",
    "backup.succeeded_with_s3_warning",
    "backup.failed",
    "backup.missing",
    "volume_backup.succeeded",
    "volume_backup.failed",
    "volume_backup.missing",
    "volume_backup.recovery_failed",
]
storage = true
routes = true
http = ["hc-ping.com"]

[[versions.manifest.capabilities.ui]]
slot = "dashboard"
title = "Healthchecks.io"
path = "/panel"

[[versions.manifest.settings]]
key = "ping_key"
label = "Project ping key"
help = "From the project's Settings → Ping key on Healthchecks.io. Each job pings https://hc-ping.com/<ping key>/<slug>."
secret = true
required = true

[[versions.manifest.settings]]
key = "create"
label = "Create checks automatically"
help = "yes: the first ping of a job creates its check (?create=1). no: only jobs whose check you created are pinged."
options = ["yes", "no"]
default = "yes"

[[versions.manifest.settings]]
key = "slug_prefix"
label = "Slug prefix"
help = "Checks are named <prefix>-task-<uuid>, <prefix>-backup-<uuid>-<database> and <prefix>-volume-<resource>-<volume>."
default = "coolify"
