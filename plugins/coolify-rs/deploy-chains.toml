# coolify-rs/deploy-chains: a first-party plugin from the coolify-rs repository.
# Every published version is immutable; only `yanked` may change later. See README.md.

[[versions]]
version = "0.1.0"
source = "https://github.com/coolify-rs/coolify-rs"
commit = "351b841c5f92a480d83b117856bb918c0645b0fb"
toolchain = "rust 1.99.1, target wasm32-wasip2"
builder = "docker.io/library/rust:1.99.1-slim-bookworm@sha256:f2c004e3d2d8b547e8cf7ffbc29205385f4e71d23e53e4e383065db5e9f822cd"
sha256 = "280a9b7a588d9e873a3541b6d4471cd1175d1a7795e25771525eef021ff940c2"
url = "https://raw.githubusercontent.com/coolify-rs/plugins/5277416d2810e3bd477875a1b5e470957099ca29/components/deploy-chains-0.1.0.wasm"

[versions.build]
dir = "plugins"
command = "rustup target add wasm32-wasip2 && cargo build --release --locked --target wasm32-wasip2 -p deploy-chains"
artifact = "target/wasm32-wasip2/release/deploy_chains.wasm"

[versions.manifest]
id = "coolify-rs/deploy-chains"
name = "Deploy chains"
version = "0.1.0"
description = "Deploys the applications that depend on an application after it deploys successfully."
license = "Apache-2.0"
source = "https://github.com/coolify-rs/coolify-rs/tree/main/plugins/official/deploy-chains"
api = "0.1"

[versions.manifest.capabilities]
events = ["deployment.succeeded"]
storage = true
routes = true
resources = ["applications"]
deploy = true

[[versions.manifest.capabilities.ui]]
slot = "application"
title = "Deploy chain"
path = "/panels/application"

[[versions.manifest.capabilities.ui]]
slot = "dashboard"
title = "Deploy chains"
path = "/panels/overview"
