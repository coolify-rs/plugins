# Checks a pull request that adds or changes plugins (README.md, "What CI checks").
# It runs the submitted code only inside the builder image and the plugin sandbox, and it has no secrets:
# `pull_request` from a fork gets a read-only token.
name: review

on:
  pull_request:
    paths: ["plugins/**"]

permissions:
  contents: read

env:
  COOLIFY_RS_REPO: https://github.com/coolify-rs/coolify-rs
  # A coolify-rs commit that includes the plugin registry and its key. Bump it to accept a new plugin interface.
  COOLIFY_RS_REF: 733463a32be1271b9e8c549c594359dd377f57d8

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The scripts and the CLI always come from the base branch, never from the pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/coolify-rs
            ~/.cargo/coolify-rs.ref
          key: coolify-rs-${{ env.COOLIFY_RS_REF }}
      - name: coolify-rs CLI
        run: base/scripts/install-coolify-rs.sh

      - name: Metadata, capability diff and review tier
        run: |
          set -o pipefail
          coolify-rs plugin review head --base base --out out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reproducible builds and conformance
        run: base/scripts/check-all.sh out

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: out
          if-no-files-found: ignore
