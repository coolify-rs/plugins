# After a change to plugins/ is merged: build index.json, sign it, verify it with the keys compiled into
# coolify-rs, and commit it to the `index` branch. Instances fetch dist/index.json and dist/index.json.sig
# from that branch. main stays protected; the index needs no branch protection because instances accept only
# an index signed by a compiled-in key, and never one older than the index they have.
name: publish

on:
  push:
    branches: [main]
    paths: ["plugins/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  COOLIFY_RS_REPO: https://github.com/coolify-rs/coolify-rs
  # The same commit as review.yml; it must contain the production key in PRODUCTION_KEYS.
  COOLIFY_RS_REF: 733463a32be1271b9e8c549c594359dd377f57d8

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Required reviewers on this environment are the last gate before the key is used.
    environment: registry-signing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/coolify-rs
            ~/.cargo/coolify-rs.ref
          key: coolify-rs-${{ env.COOLIFY_RS_REF }}
      - name: coolify-rs CLI
        run: scripts/install-coolify-rs.sh

      - name: Build and sign the index
        env:
          # The secret key file from `coolify-rs plugin keygen`, stored as an environment secret.
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$REGISTRY_SIGNING_KEY" > "$key"
          coolify-rs plugin build-index . --key "$key" --out dist

      - name: Verify with the keys coolify-rs ships
        run: coolify-rs plugin verify-index dist

      - name: Commit dist/ to the index branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=../index-branch
          if git ls-remote --exit-code --heads origin index >/dev/null; then
            git fetch -q --depth 1 origin +refs/heads/index:refs/remotes/origin/index
            git worktree add -q -B index "$branch" origin/index
          else
            git worktree add -q --detach "$branch"
            git -C "$branch" checkout -q --orphan index
            git -C "$branch" rm -rqf .
          fi
          mkdir -p "$branch/dist"
          cp dist/index.json dist/index.json.sig "$branch/dist/"
          git -C "$branch" add dist/index.json dist/index.json.sig
          git -C "$branch" commit -qm "Index for ${GITHUB_SHA::12}"
          git -C "$branch" push -q origin index
